<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Bank</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Simple Bank</h1>
  </header>

  <main>
    <section class="card">
      <h2>Create Account</h2>
      <form id="create-form">
        <label>
          Name
          <input type="text" name="name" required>
        </label>
        <label>
          Initial Balance
          <input type="number" name="initialBalance" min="0" step="0.01" value="0">
        </label>
        <button type="submit">Create</button>
        <span id="create-error" class="error"></span>
      </form>
    </section>

    <section class="card">
      <div class="row">
        <h2>Accounts</h2>
        <button id="refresh">Refresh</button>
      </div>
      <div id="accounts" class="account-list"></div>
    </section>
  </main>

  <footer>
    <small>Backend: Java built-in HTTP server • Frontend: Vanilla JS</small>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
